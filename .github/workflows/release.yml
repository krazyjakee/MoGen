name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps (eframe/rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libssl-dev \
            pkg-config

      - name: Build mogen (CLI)
        run: cargo build -p mogen --release --locked --target ${{ matrix.target }}

      - name: Build mogen-studio (GUI)
        run: cargo build -p mogen-studio --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          out="mogen-${tag}-${target}.tar.gz"

          rm -rf dist
          mkdir -p dist
          cp "target/${target}/release/mogen" dist/mogen
          cp "target/${target}/release/mogen-studio" dist/mogen-studio
          chmod +x dist/mogen dist/mogen-studio
          tar -czf "${out}" -C dist mogen mogen-studio

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $out = "mogen-$tag-$target.zip"

          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/$target/release/mogen.exe" "dist/mogen.exe"
          Copy-Item "target/$target/release/mogen-studio.exe" "dist/mogen-studio.exe"
          Push-Location dist
          Compress-Archive -Path "mogen.exe","mogen-studio.exe" -DestinationPath "../$out" -Force
          Pop-Location

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            mogen-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            mogen-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          for f in mogen-*.tar.gz mogen-*.zip; do
            if [[ -f "$f" ]]; then
              sha256sum "$f" >> SHA256SUMS
            fi
          done
          if [[ ! -s SHA256SUMS ]]; then
            echo "No release archives found to checksum" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mogen-*.tar.gz
            mogen-*.zip
            SHA256SUMS
