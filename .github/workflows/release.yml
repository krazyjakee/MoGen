name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps (eframe/rfd)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libssl-dev pkg-config
          version: 1.0

      - name: Build mogen (CLI)
        run: cargo build -p mogen --release --locked --target ${{ matrix.target }}

      - name: Build mogen-studio (GUI)
        run: cargo build -p mogen-studio --release --locked --target ${{ matrix.target }}

      - name: Package (unix tarball)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          out="mogen-${tag}-${target}.tar.gz"

          rm -rf dist
          mkdir -p dist
          cp "target/${target}/release/mogen" dist/mogen
          cp "target/${target}/release/mogen-studio" dist/mogen-studio
          chmod +x dist/mogen dist/mogen-studio
          tar -czf "${out}" -C dist mogen mogen-studio

      - name: Package (windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $out = "mogen-$tag-$target.zip"

          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/$target/release/mogen.exe" "dist/mogen.exe"
          Copy-Item "target/$target/release/mogen-studio.exe" "dist/mogen-studio.exe"
          Push-Location dist
          Compress-Archive -Path "mogen.exe","mogen-studio.exe" -DestinationPath "../$out" -Force
          Pop-Location

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Package .deb (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          cargo deb -p mogen-studio --no-build --target "${target}"
          src=$(ls "target/${target}/debian"/*.deb | head -n1)
          cp "${src}" "mogen-${tag}-${target}.deb"

      - name: Install cargo-wix
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Generate Windows app icon (.ico)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          magick assets/icon.png `
            -define icon:auto-resize=256,128,64,48,32,24,16 `
            "target/$target/release/AppIcon.ico"

      - name: Package .msi (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $out = "mogen-$tag-$target.msi"
          cargo wix -p mogen-studio --no-build --nocapture --target $target --output $out

      - name: Package .dmg (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          version="${tag#v}"
          app="MoGen Studio.app"

          rm -rf "${app}" dmg-staging
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp "target/${target}/release/mogen-studio" "${app}/Contents/MacOS/mogen-studio"
          cp "target/${target}/release/mogen"        "${app}/Contents/MacOS/mogen"
          chmod +x "${app}/Contents/MacOS/mogen-studio" "${app}/Contents/MacOS/mogen"

          iconset="AppIcon.iconset"
          rm -rf "${iconset}"
          mkdir -p "${iconset}"
          sips -z 16   16   assets/icon.png --out "${iconset}/icon_16x16.png"     >/dev/null
          sips -z 32   32   assets/icon.png --out "${iconset}/icon_16x16@2x.png"  >/dev/null
          sips -z 32   32   assets/icon.png --out "${iconset}/icon_32x32.png"     >/dev/null
          sips -z 64   64   assets/icon.png --out "${iconset}/icon_32x32@2x.png"  >/dev/null
          sips -z 128  128  assets/icon.png --out "${iconset}/icon_128x128.png"   >/dev/null
          sips -z 256  256  assets/icon.png --out "${iconset}/icon_128x128@2x.png">/dev/null
          sips -z 256  256  assets/icon.png --out "${iconset}/icon_256x256.png"   >/dev/null
          sips -z 512  512  assets/icon.png --out "${iconset}/icon_256x256@2x.png">/dev/null
          cp assets/icon.png "${iconset}/icon_512x512.png"
          iconutil -c icns "${iconset}" -o "${app}/Contents/Resources/AppIcon.icns"

          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MoGen Studio</string>
            <key>CFBundleDisplayName</key><string>MoGen Studio</string>
            <key>CFBundleIdentifier</key><string>com.cattrall.mogen-studio</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key><string>mogen-studio</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          mkdir dmg-staging
          mv "${app}" "dmg-staging/${app}"
          ln -s /Applications dmg-staging/Applications

          out="mogen-studio-${tag}-${target}.dmg"
          hdiutil create \
            -volname "MoGen Studio" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "${out}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            mogen-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            mogen-${{ github.ref_name }}-${{ matrix.target }}.zip
            mogen-${{ github.ref_name }}-${{ matrix.target }}.deb
            mogen-${{ github.ref_name }}-${{ matrix.target }}.msi
            mogen-studio-${{ github.ref_name }}-${{ matrix.target }}.dmg
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          shopt -s nullglob
          for f in mogen-*.tar.gz mogen-*.zip mogen-*.deb mogen-*.msi mogen-studio-*.dmg; do
            sha256sum "$f" >> SHA256SUMS
          done
          if [[ ! -s SHA256SUMS ]]; then
            echo "No release archives found to checksum" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mogen-*.tar.gz
            mogen-*.zip
            mogen-*.deb
            mogen-*.msi
            mogen-studio-*.dmg
            SHA256SUMS
