name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'web/**'
      - 'examples/**'
      - 'crates/mogen-wasm/**'
      - 'crates/mogen-core/**'
      - 'crates/mogen-dsl/**'
      - 'crates/mogen-validate/**'
      - 'crates/mogen-export/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: write          # needed to push to the gh-pages branch

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    env:
      # Pinned LLVM bin dir for manifold-csg-sys's build.rs to skip the
      # find_llvm() detection ladder. apt.llvm.org's debian packages install
      # the toolchain here, which is what wasm-cxx-shim probes for.
      WASM_CXX_SHIM_LLVM_BIN_DIR: /usr/lib/llvm-20/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # LLVM 20 + libc++/libc++abi + lld are required by manifold-csg's
      # `unstable-wasm-uu` feature (cross-compiles Manifold C++ for
      # wasm32-unknown-unknown via wasm-cxx-shim). Default ubuntu-latest
      # ships clang-18, which the shim doesn't support.
      #
      # Ubuntu noble's own universe repo also carries a clang-20 (currently
      # 20.1.2-0ubuntu1~24.04.2), but that version has a libc++ regression
      # where `<__locale>` unconditionally pulls in `<musl.h>` even with
      # `_LIBCPP_HAS_LOCALIZATION=0`, which breaks the wasm-cxx-shim build.
      # Fixed in 20.1.8+ (apt.llvm.org). We pin apt.llvm.org above noble's
      # universe so apt never picks Ubuntu's stale 20.1.2 by accident, then
      # sanity-check the resolved version.
      - name: Install LLVM 20 + libc++ + lld
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo tee /etc/apt/preferences.d/llvm.pref >/dev/null <<'EOF'
          Package: *
          Pin: origin apt.llvm.org
          Pin-Priority: 700
          EOF
          sudo apt-get update
          sudo apt-get install -y -t llvm-toolchain-$(lsb_release -cs)-20 \
            clang-20 lld-20 libc++-20-dev libc++abi-20-dev libllvm20 libclang-cpp20
          # Guard against a regression: 20.1.2 (Ubuntu noble's version) is
          # known-broken for this build. Anything 20.1.8+ from apt.llvm.org
          # works.
          ver=$(clang-20 --version | awk '/clang version/ {print $4; exit}')
          echo "clang-20 resolved to: $ver"
          case "$ver" in
            20.0.*|20.1.[0-7]|20.1.[0-7].*)
              echo "::error::clang-20 $ver is too old; need 20.1.8+ from apt.llvm.org" >&2
              exit 1
              ;;
          esac

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo registry + wasm build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build static site (incl. playground)
        run: ./site/build.sh

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true   # one-commit branch — every deploy is a clean snapshot
          commit_message: 'docs: deploy ${{ github.sha }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
