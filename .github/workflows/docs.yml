name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'web/**'
      - 'examples/**'
      - 'crates/mogen-wasm/**'
      - 'crates/mogen-core/**'
      - 'crates/mogen-dsl/**'
      - 'crates/mogen-validate/**'
      - 'crates/mogen-export/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: write          # needed to push to the gh-pages branch

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    env:
      # Pinned LLVM bin dir for manifold-csg-sys's build.rs to skip the
      # find_llvm() detection ladder. apt.llvm.org's debian packages install
      # the toolchain here, which is what wasm-cxx-shim probes for.
      WASM_CXX_SHIM_LLVM_BIN_DIR: /usr/lib/llvm-20/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # LLVM 20 + libc++/libc++abi + lld are required by manifold-csg's
      # `unstable-wasm-uu` feature (cross-compiles Manifold C++ for
      # wasm32-unknown-unknown via wasm-cxx-shim). Default ubuntu-latest
      # ships clang-18, which the shim doesn't support.
      - name: Install LLVM 20 + libc++ + lld
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 libc++-20-dev libc++abi-20-dev

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo registry + wasm build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build static site (incl. playground)
        run: ./site/build.sh

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true   # one-commit branch — every deploy is a clean snapshot
          commit_message: 'docs: deploy ${{ github.sha }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
