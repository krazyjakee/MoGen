[package]
name = "mogen-dsl"
version.workspace = true
edition.workspace = true

[features]
default = ["csg"]
# Pass-through to `mogen-geom/csg`. Default ON so the host build behaves as
# before; the wasm crate sets `default-features = false` to drop the manifold
# C++ dependency. With csg off, `lower_csg` will still compile but invoking
# it at runtime hits a panic stub — wasm callers must reject CSG AST nodes
# before lowering.
csg = ["mogen-geom/csg"]

[dependencies]
mogen-core = { workspace = true }
mogen-geom = { workspace = true, default-features = false }
mogen-anim = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
glam = { workspace = true }
