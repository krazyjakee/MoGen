[package]
name = "mogen-dsl"
version.workspace = true
edition.workspace = true

[features]
default = ["csg"]
# Desktop CSG. Pass-through to `mogen-geom/csg`.
csg = ["mogen-geom/csg"]
# Wasm CSG. Pass-through to `mogen-geom/unstable-wasm-uu`. Mutually
# exclusive with `csg` on a given build target — they each select a
# different cmake configuration of the same Manifold C++ library.
unstable-wasm-uu = ["mogen-geom/unstable-wasm-uu"]

[dependencies]
mogen-core = { workspace = true }
mogen-geom = { workspace = true, default-features = false }
mogen-anim = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
glam = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
