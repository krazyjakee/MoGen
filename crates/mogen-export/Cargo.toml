[package]
name = "mogen-export"
version.workspace = true
edition.workspace = true

[features]
default = ["textures", "textures-optimize", "textures-svg", "merge", "lod", "imposter"]
# Texture packing. Splits cleanly across two layers so wasm builds can
# embed images without pulling in `image`/`oxipng` (which depend on C libs
# that don't cross-compile to wasm32):
#
# - `textures`          — base path: read bytes through the supplied
#                         `TextureSource` and embed them as-is. MIME comes
#                         from the file extension; no decode, no re-encode.
#                         This is what the wasm preview uses.
# - `textures-optimize` — desktop add-on: pulls in `image` + `oxipng` so
#                         colour slots transcode to JPEG q=90 (when alpha
#                         allows) and linear slots get oxipng-shrunk.
#
# With neither feature enabled, `pack_textures` returns an empty table
# and materials export with PBR factors only.
textures = []
textures-optimize = ["textures", "dep:image", "dep:oxipng"]
# - `textures-svg`      — rasterize `.svg` texture references to PNG before
#                         export, so every downstream consumer (GLB embed,
#                         FBX paths, Studio preview, derived PBR maps) only
#                         ever sees raster. On by default for desktop. The
#                         deps are pure Rust, so unlike `textures-optimize`
#                         this one *can* be enabled for wasm too — the wasm
#                         crate just has to opt in explicitly, since it
#                         builds with `default-features = false`.
textures-svg = ["textures", "dep:mogen-svg"]
# Sibling-mesh merge module. The merge pass calls into `mogen-geom`'s CSG
# `union_many`; whichever crate enables the `csg` (desktop) or
# `unstable-wasm-uu` (wasm) flavor of `mogen-geom` is responsible for
# providing the actual backend. With this feature on but no CSG flavor
# selected anywhere in the workspace, calling `union_many` would hit the
# `csg_stub` panic.
merge = []
# Binary FBX 7.4 export. Off by default — pulls in `fbxcel`, which the
# wasm crate doesn't enable. The desktop CLI turns this on so `mogen build`
# can dispatch on output extension.
fbx = ["dep:fbxcel"]
# LOD mesh simplification. Pulls in `meshopt` which links a small C++ lib via
# `cc`; doesn't cross-compile to wasm32-unknown-unknown, so wasm builds keep
# this disabled. With this off, the `bundle_lods_and_imposter` option only
# emits the imposter half (or no-ops entirely if `imposter` is also off).
lod = ["dep:meshopt"]
# Headless imposter atlas bake. Pulls in `mogen-render` (glow + glutin +
# winit), which needs a real display server / GL stack at runtime and a
# windowing toolkit at build time; wasm and CI-headless builds keep this
# disabled. Also requires `textures` so the spritesheet PNG can be embedded
# alongside the billboard material.
imposter = ["textures", "dep:mogen-render", "dep:image"]

[dependencies]
mogen-core = { workspace = true }
mogen-geom = { workspace = true, default-features = false }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }
image = { workspace = true, optional = true }
oxipng = { workspace = true, optional = true }
mogen-svg = { workspace = true, optional = true }
fbxcel = { version = "0.9", features = ["writer", "tree"], optional = true }
meshopt = { workspace = true, optional = true }
mogen-render = { workspace = true, optional = true }

[dev-dependencies]
mogen-dsl = { workspace = true, features = ["csg"] }
# Non-optional here so the `svg` module's tests can decode what they rendered
# even in a `--no-default-features --features textures-svg` build.
image = { workspace = true }
