[package]
name = "mogen"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mogen"
path = "src/main.rs"

[dependencies]
mogen-core = { workspace = true }
# Workspace defaults are off so the wasm crate can disable CSG/textures/merge.
# The CLI wants the full pipeline, so opt back in to every default feature.
mogen-dsl = { workspace = true, features = ["csg"] }
mogen-validate = { workspace = true, features = ["csg"] }
mogen-export = { workspace = true, features = ["textures", "merge"] }
mogen-llm = { workspace = true }
mogen-moghub-client = { workspace = true, features = ["oauth"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
mogen-registry = { workspace = true }
mogen-render = { workspace = true }
mogen-update = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
indicatif = "0.17"
image = { workspace = true }
# Used to base64-encode the publish-thumbnail PNG before attaching it to
# `PublishRequest::thumbnail_png_base64`.
base64 = "0.22"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
