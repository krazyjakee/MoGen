[package]
name = "mogen"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mogen"
path = "src/main.rs"

[dependencies]
mogen-core = { workspace = true }
# Workspace defaults are off so the wasm crate can disable CSG/textures/merge.
# The CLI wants the full pipeline, so opt back in to every default feature.
mogen-dsl = { workspace = true, features = ["csg"] }
mogen-validate = { workspace = true, features = ["csg"] }
mogen-export = { workspace = true, features = ["textures", "merge", "fbx"] }
mogen-llm = { workspace = true }
mogen-moghub-client = { workspace = true, features = ["oauth"] }
mogen-render = { workspace = true }
mogen-update = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
clap = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
indicatif = "0.17"
# MCP server (`mogen mcp` subcommand). `default` pulls in macros + the
# stdio-capable server scaffolding; `transport-io` adds the actual stdio
# transport. Tokio is only used by the MCP path — every other subcommand
# stays sync.
rmcp = { version = "1", features = ["transport-io"] }
schemars = "0.8"
serde = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "sync"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
