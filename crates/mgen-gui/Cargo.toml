[package]
name = "mgen-gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mgen-gui"
path = "src/main.rs"

[dependencies]
mgen-core = { workspace = true }
mgen-dsl = { workspace = true }
mgen-validate = { workspace = true }
mgen-export = { workspace = true }
mgen-llm = { workspace = true }
anyhow = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "5"

eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_glow = "0.29"
glow = "0.14"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
