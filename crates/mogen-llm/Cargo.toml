[package]
name = "mogen-llm"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

mogen-core.workspace = true
mogen-dsl = { workspace = true, features = ["csg"] }
mogen-validate = { workspace = true, features = ["csg"] }
glam.workspace = true

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
image.workspace = true
tiny_http = "0.12"
webbrowser = "1"
sha2 = "0.10"
rand = "0.8"
tempfile = "3"
# Bundled SQLite — used by the `spend` module to persist per-call LLM/image
# spend records to `~/.mogen/spend.db`. The `bundled` feature compiles
# libsqlite3 statically so we don't pick up whatever the host system has
# installed (or doesn't).
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
base64 = "0.22"
