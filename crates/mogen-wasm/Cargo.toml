[package]
name = "mogen-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Direct path dependencies (instead of `workspace = true`) so we can pass
# `default-features = false` and actually have it stick — workspace
# inheritance can't override defaults when the workspace entry leaves them
# on.
#
# CSG works on wasm via `manifold-csg`'s provisional `unstable-wasm-uu`
# feature, forwarded through `mogen-dsl`. That requires LLVM 20+ on the
# build host (see workspace README). The base `textures` feature on
# `mogen-export` is on (pass-through path: read bytes from a caller-
# supplied in-memory map and embed as-is); `textures-optimize` stays off
# because `image` + `oxipng` can't cross-compile to wasm32.
mogen-core = { path = "../mogen-core" }
mogen-dsl = { path = "../mogen-dsl", default-features = false, features = ["unstable-wasm-uu"] }
mogen-validate = { path = "../mogen-validate", default-features = false }
mogen-export = { path = "../mogen-export", default-features = false, features = ["merge", "textures"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = "0.1"

# Skip wasm-pack's wasm-opt post-processing pass — it downloads a binaryen
# tarball at build time, which is brittle in restricted-network CI and adds
# non-trivial build time. The unoptimized .wasm is well under the WASM
# streaming threshold; size is fine.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
