[package]
name = "mogen-geom"
version.workspace = true
edition.workspace = true

[features]
default = ["csg"]
# Desktop CSG. `csg` pulls in `manifold-csg`, which builds Google's Manifold
# C++ library via cmake. Native target uses TBB-backed parallelism inside
# Manifold's boolean kernel.
csg = ["dep:manifold-csg", "manifold-csg/parallel"]
# Wasm CSG. Forwards to `manifold-csg`'s provisional `unstable-wasm-uu`
# feature, which builds Manifold + Clipper2 for `wasm32-unknown-unknown`
# via the `wasm-cxx-shim` C++ runtime shim. Mutually exclusive with `csg`
# in practice (the `parallel` feature can't link on wasm). Build host
# requires LLVM 20+ on PATH; see the workspace README for setup.
unstable-wasm-uu = ["dep:manifold-csg", "manifold-csg/unstable-wasm-uu"]

[dependencies]
mogen-core = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
gltf = { workspace = true }
earcutr = "0.5"
fast-surface-nets = "0.2"
manifold-csg = { version = "0.1.8", optional = true, default-features = false }
