[workspace]
resolver = "2"
members = [
    "crates/mogen-core",
    "crates/mogen-dsl",
    "crates/mogen-geom",
    "crates/mogen-validate",
    "crates/mogen-anim",
    "crates/mogen-binary",
    "crates/mogen-export",
    "crates/mogen-llm",
    "crates/mogen",
    "crates/mogen-pascal",
    "crates/mogen-moghub-client",
    "crates/mogen-registry",
    "crates/mogen-render",
    "crates/mogen-studio",
    "crates/mogen-update",
    "crates/mogen-wasm",
]

[workspace.package]
version = "0.1.11"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
oxipng = { version = "9", default-features = false, features = ["parallel"] }
# SVG rasterization for `mogen-export`'s `textures-svg` feature. Pure Rust, so
# unlike `image`/`oxipng` these do cross-compile to wasm32. `usvg`'s default
# features are off deliberately: they pull in `fontdb`, which enumerates
# system fonts at render time and would make rasterization depend on which
# machine ran the build. Text in an SVG must be converted to paths first.
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
# meshoptimizer Rust bindings. Used by `mogen-export`'s LOD pass to generate
# simplified index buffers via quadric edge collapse. Wraps a small C++ lib
# behind `cc`; doesn't cross-compile to `wasm32-unknown-unknown`, so wasm
# builds keep the `lod` feature disabled.
meshopt = "0.6"
# `import` is the simple high-level API for reading .glb/.gltf into typed
# accessors. Default features pull in the `image` crate for embedded textures
# (we strip materials/textures on import, but keeping defaults avoids one more
# feature flag to maintain when someone adds texture support later).
gltf = { version = "1", default-features = false, features = ["import", "names", "utils"] }

mogen-core = { path = "crates/mogen-core" }
# These three crates host opt-in features (`csg`, `merge`, `textures`) that
# the wasm build needs to disable. Setting `default-features = false` here
# lets each consumer turn defaults back on (or off) explicitly — workspace
# inheritance can't override an upstream `default-features = true`.
mogen-dsl = { path = "crates/mogen-dsl", default-features = false }
mogen-geom = { path = "crates/mogen-geom", default-features = false }
mogen-validate = { path = "crates/mogen-validate", default-features = false }
mogen-anim = { path = "crates/mogen-anim" }
mogen-binary = { path = "crates/mogen-binary" }
mogen-export = { path = "crates/mogen-export", default-features = false }
mogen-llm = { path = "crates/mogen-llm" }
mogen-pascal = { path = "crates/mogen-pascal" }
mogen-moghub-client = { path = "crates/mogen-moghub-client" }
mogen-registry = { path = "crates/mogen-registry" }
mogen-render = { path = "crates/mogen-render" }
mogen-update = { path = "crates/mogen-update" }
