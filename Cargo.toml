[workspace]
resolver = "2"
members = [
    "crates/mogen-core",
    "crates/mogen-dsl",
    "crates/mogen-geom",
    "crates/mogen-validate",
    "crates/mogen-anim",
    "crates/mogen-export",
    "crates/mogen-llm",
    "crates/mogen",
    "crates/mogen-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
oxipng = { version = "9", default-features = false, features = ["parallel"] }

mogen-core = { path = "crates/mogen-core" }
mogen-dsl = { path = "crates/mogen-dsl" }
mogen-geom = { path = "crates/mogen-geom" }
mogen-validate = { path = "crates/mogen-validate" }
mogen-anim = { path = "crates/mogen-anim" }
mogen-export = { path = "crates/mogen-export" }
mogen-llm = { path = "crates/mogen-llm" }
