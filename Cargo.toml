[workspace]
resolver = "2"
members = [
    "crates/mgen-core",
    "crates/mgen-dsl",
    "crates/mgen-geom",
    "crates/mgen-validate",
    "crates/mgen-anim",
    "crates/mgen-export",
    "crates/mgen-llm",
    "crates/mgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }

mgen-core = { path = "crates/mgen-core" }
mgen-dsl = { path = "crates/mgen-dsl" }
mgen-geom = { path = "crates/mgen-geom" }
mgen-validate = { path = "crates/mgen-validate" }
mgen-anim = { path = "crates/mgen-anim" }
mgen-export = { path = "crates/mgen-export" }
mgen-llm = { path = "crates/mgen-llm" }
